name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rename firestore.html to index.html (Solo para GitHub Pages)
        run: |
          mv firestore.html index.html

      - name: Inject Firebase Secrets
        run: |
          sed -i 's/TU_API_KEY_AQUI/${{ secrets.FIREBASE_API_KEY }}/g' firebase_config.js
          sed -i 's/TU_AUTH_DOMAIN_AQUI/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g' firebase_config.js
          sed -i 's/TU_PROJECT_ID_AQUI/${{ secrets.FIREBASE_PROJECT_ID }}/g' firebase_config.js
          sed -i 's/TU_STORAGE_BUCKET_AQUI/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g' firebase_config.js
          sed -i 's/TU_MESSAGING_SENDER_ID_AQUI/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g' firebase_config.js
          sed -i 's/TU_APP_ID_AQUI/${{ secrets.FIREBASE_APP_ID }}/g' firebase_config.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
